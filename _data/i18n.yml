# Interface text, one block per language.
# The first language is the default: it is what Jekyll writes into the HTML,
# and what visitors without JavaScript see. The toggle switches between all
# languages listed here, in this order.

languages:
  - code: en
    label: EN
    name: English
  - code: pt-BR
    label: PT
    name: Português (Brasil)

strings:
  en:
    tagline: essays, asked for
    home_title: monolith — essays, asked for
    moai_alt: A moai statue wearing sunglasses stands in a dark green field under the Milky Way, with a tabby cat asleep at its base.
    language: Language
    read_all: or read everything it has said
    ask_pill: ask me something
    ask_label: What are you wondering about?
    ask_placeholder: why does anything last?
    never_mind: never mind
    ask: ask
    thinking: thinking
    speech_label: What the monolith said
    everything: everything
    ask_again: ask again
    you_asked: you asked —
    also_near: also near your question
    other_things: other things it has said
    other_posts: Other posts
    archive_title: Everything it has said
    archive_page_title: Everything
    filter_label: Filter by tag
    all: all
