title: monolith
description: A moai stands in a night field. Ask it something and it answers with the closest thing it has written.

url: "https://vinissaurus.github.io"
baseurl: ""

permalink: /posts/:slug/
timezone: America/Sao_Paulo
markdown: kramdown

# The one background image. If you replace it, update width/height to match
# the new file (the oracle reads the aspect ratio from them before it loads).
# Its alt text lives with the other interface text, in _data/i18n.yml.
moai:
  src: /assets/moai.jpg
  width: 1408
  height: 768

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - templates
